name: RIP Platform Tests

on:
  push:
    branches:
      - main
      - "milestone/**"
      - "infrastructure/**"

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: 70-Platform

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install RIP
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v